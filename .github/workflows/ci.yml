name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild data and run SQL analysis
        run: python run_analysis.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated results are current
        run: git diff --exit-code -- README.md results
